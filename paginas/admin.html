<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bergen Perfumes</title>
    <link rel="stylesheet" href="../estilos/estilo.css">
</head>
<body>
    <header class="header" id="header"></header>
    <main class="contenedor-admin">
        <h1 class="titulo-admin">Panel de Administracion</h1>
        <section class="resumen-metricas">
            <div class="tarjeta"> 
                <h3>Ventas del Mes</h3>
                <p>$1.250.000</p>
            </div>
            <div class="tarjeta">
                <h3>Pedidos</h3>
                <p>4</p>
            </div>
        </section>
        <section class="ultimas-ventas">
            <h2>Últimas Compras</h2>
            <table class="tabla-admin">
                <tr>
                    <th>Cliente</th>
                    <th>Perfume</th>
                    <th>Total</th>
                </tr>
                <tr>
                    <td>Maria Juana</td>
                    <td>Polo Blue</td>
                    <td>$65.000</td>
                </tr>
                <tr>
                    <td>Juan Carlos Bodoque</td>
                    <td>Big Pony</td>
                    <td>$70.000</td>
                </tr>
            </table>
        </section>
    </main>
    <footer class="footer" id="footer"></footer>
    <script src="../scripts/script.js"></script>
</body>
</html>
